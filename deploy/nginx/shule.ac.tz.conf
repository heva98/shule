server {
    listen 80;
    server_name shule.ac.tz www.shule.ac.tz;

    client_max_body_size 20M;

    location /static/ {
        alias /home/deployuser/shule/staticfiles/;
    }

    location /media/ {
        alias /home/deployuser/shule/media/;
    }

    # Student documents (birth certificates, medical forms, national IDs, transfer
    # letters) are sensitive — never serve them directly. The only legitimate path
    # to their bytes is /api/documents/<pk>/download/, which checks the requesting
    # user's role in Django before internally redirecting here.
    location /media/student_documents/ {
        deny all;
        return 403;
    }

    location /protected-media/ {
        internal;
        alias /home/deployuser/shule/media/;
    }

    # Same 5/min budget as accounts.views.LoginView's app-level throttle, but
    # enforced here too so a flood is dropped by Nginx before it ever reaches
    # Gunicorn/Django/Redis. `limit_req_zone login` is declared once in the
    # main nginx.conf's http{} block — see deploy/DEPLOY.md step 9a.
    location = /api/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # General flood/DoS guard for the rest of the API (fee summaries,
        # bulk mark entry, class performance, etc.) — well above normal
        # per-user traffic, just enough to blunt a naive request flood.
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /home/deployuser/shule/shule-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
